name: CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: pytest

  docker-build-and-push:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set image name
        id: vars
        run: |
          echo "IMAGE_NAME=${{ secrets.DOCKERHUB_USERNAME }}/devops-platform-app" >> $GITHUB_OUTPUT

      - name: Build image
        run: |
          docker build -t ${{ steps.vars.outputs.IMAGE_NAME }}:${{ github.sha }} .
          docker tag ${{ steps.vars.outputs.IMAGE_NAME }}:${{ github.sha }} ${{ steps.vars.outputs.IMAGE_NAME }}:latest

      - name: Push image
        run: |
          docker push ${{ steps.vars.outputs.IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ steps.vars.outputs.IMAGE_NAME }}:latest
